<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="ramBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#04060c"/>
    </radialGradient>
    <linearGradient id="ramRgb1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="35%" stop-color="#00ff88"/>
      <stop offset="70%" stop-color="#ffcc00"/>
      <stop offset="100%" stop-color="#ff1e27"/>
    </linearGradient>
    <linearGradient id="ramRgb2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7000ff"/>
      <stop offset="40%" stop-color="#ff0088"/>
      <stop offset="80%" stop-color="#ff5500"/>
      <stop offset="100%" stop-color="#ffff00"/>
    </linearGradient>
    <filter id="lightGlow" x="-20%" y="-10%" width="140%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#ramBg)"/>

  <!-- RAM Stick 1 (Left) -->
  <g transform="translate(230, 40)">
    <!-- Main PCB / Heatsink -->
    <rect x="0" y="25" width="45" height="270" rx="6" fill="#0d111c" stroke="#253047" stroke-width="2"/>
    <rect x="6" y="35" width="33" height="245" rx="4" fill="#131929"/>

    <!-- Geometric Heatspreader Accents -->
    <path d="M12,60 H33 M12,80 H33 M12,100 H33 M12,120 H33 M12,140 H33" stroke="#222b40" stroke-width="2"/>
    <text x="22" y="200" transform="rotate(-90 22 200)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#cbd5e1" letter-spacing="4">VENGEANCE</text>
    <text x="35" y="200" transform="rotate(-90 35 200)" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#00e5ff" letter-spacing="2">DDR5 6000</text>

    <!-- Glowing Top RGB Diffuser Bar -->
    <rect x="3" y="10" width="39" height="24" rx="4" fill="url(#ramRgb1)" filter="url(#lightGlow)"/>
    <rect x="8" y="14" width="29" height="16" rx="2" fill="#ffffff" opacity="0.6"/>

    <!-- Bottom Gold Pins -->
    <rect x="8" y="295" width="29" height="8" fill="#d4af37"/>
  </g>

  <!-- RAM Stick 2 (Right) -->
  <g transform="translate(325, 40)">
    <!-- Main PCB / Heatsink -->
    <rect x="0" y="25" width="45" height="270" rx="6" fill="#0d111c" stroke="#253047" stroke-width="2"/>
    <rect x="6" y="35" width="33" height="245" rx="4" fill="#131929"/>

    <!-- Geometric Heatspreader Accents -->
    <path d="M12,60 H33 M12,80 H33 M12,100 H33 M12,120 H33 M12,140 H33" stroke="#222b40" stroke-width="2"/>
    <text x="22" y="200" transform="rotate(-90 22 200)" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="900" fill="#cbd5e1" letter-spacing="4">VENGEANCE</text>
    <text x="35" y="200" transform="rotate(-90 35 200)" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="bold" fill="#ff1e27" letter-spacing="2">DDR5 6000</text>

    <!-- Glowing Top RGB Diffuser Bar -->
    <rect x="3" y="10" width="39" height="24" rx="4" fill="url(#ramRgb2)" filter="url(#lightGlow)"/>
    <rect x="8" y="14" width="29" height="16" rx="2" fill="#ffffff" opacity="0.6"/>

    <!-- Bottom Gold Pins -->
    <rect x="8" y="295" width="29" height="8" fill="#d4af37"/>
  </g>
</svg>
