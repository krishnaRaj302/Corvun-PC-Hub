<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <radialGradient id="coolerBg" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#151926"/>
      <stop offset="100%" stop-color="#05070e"/>
    </radialGradient>
    <linearGradient id="finGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a334a"/>
      <stop offset="100%" stop-color="#141926"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#coolerBg)"/>

  <!-- Stealth Dual-Tower CPU Cooler -->
  <g transform="translate(180, 45)">
    <!-- Tower 1 (Left) -->
    <rect x="20" y="25" width="85" height="230" rx="6" fill="url(#finGrad)" stroke="#222a3d" stroke-width="2"/>
    <!-- Dense Aluminum Fins -->
    <path d="M20,40 H105 M20,55 H105 M20,70 H105 M20,85 H105 M20,100 H105 M20,115 H105 M20,130 H105 M20,145 H105 M20,160 H105 M20,175 H105 M20,190 H105 M20,205 H105 M20,220 H105 M20,235 H105" stroke="#10141f" stroke-width="3"/>

    <!-- Central Cooling Fan (Middle) -->
    <rect x="95" y="20" width="45" height="240" rx="8" fill="#070a12" stroke="#ff1e27" stroke-width="2"/>
    <circle cx="117" cy="140" r="45" fill="#0b0e17" stroke="#252e42" stroke-width="2"/>
    <circle cx="117" cy="140" r="16" fill="#141a29" stroke="#ff1e27" stroke-width="1.5"/>

    <!-- Tower 2 (Right) -->
    <rect x="135" y="25" width="85" height="230" rx="6" fill="url(#finGrad)" stroke="#222a3d" stroke-width="2"/>
    <path d="M135,40 H220 M135,55 H220 M135,70 H220 M135,85 H220 M135,100 H220 M135,115 H220 M135,130 H220 M135,145 H220 M135,160 H220 M135,175 H220 M135,190 H220 M135,205 H220 M135,220 H220 M135,235 H220" stroke="#10141f" stroke-width="3"/>

    <!-- Heatpipes Copper/Nickel Base -->
    <path d="M50,255 C50,285 110,295 120,295 C130,295 190,285 190,255" fill="none" stroke="#d47937" stroke-width="6"/>
    <rect x="70" y="280" width="100" height="20" rx="4" fill="#0e1320" stroke="#ff1e27" stroke-width="1.5"/>
    <text x="120" y="293" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="8" font-weight="900" fill="#cbd5e1" letter-spacing="1">DEEPCOOL TWIN</text>
  </g>
</svg>
